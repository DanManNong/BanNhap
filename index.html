<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>阮晋峰 | 知识 • 法律 • 科技</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --zen-bg: #2C2C2C;
            --zen-copper: #E0AA79;
        }
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: var(--zen-bg);
            color: #FFFFFF;
            background-image: radial-gradient(rgba(224, 170, 121, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .serif-title { font-family: 'Noto Serif SC', serif; }
        .letter-spacing-wide { letter-spacing: 0.5em; text-indent: 0.5em; }
        
        /* Hiệu ứng nút Zen */
        .zen-btn {
            border: 1px solid rgba(224, 170, 121, 0.4);
            color: var(--zen-copper);
            padding: 10px 24px;
            font-size: 12px;
            transition: all 0.4s ease;
            display: inline-flex;
            align-items: center;
            background: transparent;
        }
        .zen-btn:hover {
            background: rgba(224, 170, 121, 0.1);
            border-color: var(--zen-copper);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="py-16 text-center">
        <div class="text-[10px] text-stone-500 uppercase letter-spacing-wide">知识 • 法律 • 科技</div>
    </header>

    <main class="flex-grow flex flex-col items-center px-6">
        <div class="mb-10">
            <div class="w-44 h-44 rounded-full border-2 border-[#E0AA79]/30 overflow-hidden shadow-2xl">
                <img src="avatar-nguyentanphong.jpg" alt="阮晋峰" class="w-full h-full object-cover">
            </div>
        </div>

        <h1 class="serif-title text-4xl md:text-5xl font-light text-[#E0AA79] mb-6 tracking-[0.2em]">阮晋峰</h1>
        <div class="w-12 h-[1px] bg-[#E0AA79]/50 mb-10"></div>

        <div class="flex flex-wrap justify-center gap-4 mb-20">
            <button class="zen-btn"><i class="fas fa-qrcode mr-2"></i> 电子名片</button>
            <button class="zen-btn"><i class="fas fa-edit mr-2"></i> 咨询登记</button>
            <button class="zen-btn"><i class="fas fa-file-alt mr-2"></i> 资历档案</button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 w-full max-w-6xl mb-24">
            <div class="bg-black/20 border border-white/5 p-8 text-center">
                <i class="fas fa-network-wired text-[#E0AA79] mb-4 text-xl"></i>
                <h3 class="text-xs font-bold mb-2">VECOM</h3>
                <p class="text-[10px] text-stone-400 leading-relaxed">越南电子商务协会<br>执行委员会委员<br>南部首席代表</p>
            </div>
            <div class="bg-black/20 border border-white/5 p-8 text-center">
                <i class="fas fa-gavel text-[#E0AA79] mb-4 text-xl"></i>
                <h3 class="text-xs font-bold mb-2">CLEAD</h3>
                <p class="text-[10px] text-stone-400 leading-relaxed">法律咨询中心<br>主任<br>(VECOM 旗下)</p>
            </div>
            <div class="bg-black/20 border border-white/5 p-8 text-center">
                <i class="fas fa-scale-balanced text-[#E0AA79] mb-4 text-xl"></i>
                <h3 class="text-xs font-bold mb-2">ARI</h3>
                <p class="text-[10px] text-stone-400 leading-relaxed">法学家<br>法律科学与仲裁研究院<br>副院长</p>
            </div>
            <div class="bg-black/20 border border-white/5 p-8 text-center">
                <i class="fas fa-handshake-simple text-[#E0AA79] mb-4 text-xl"></i>
                <h3 class="text-xs font-bold mb-2">TRACENT</h3>
                <p class="text-[10px] text-stone-400 leading-relaxed">商业仲裁员<br>胡志明市<br>商业仲裁中心</p>
            </div>
            <div class="bg-black/20 border border-white/5 p-8 text-center">
                <i class="fas fa-graduation-cap text-[#E0AA79] mb-4 text-xl"></i>
                <h3 class="text-xs font-bold mb-2">EAGLE</h3>
                <p class="text-[10px] text-stone-400 leading-relaxed">房地产与<br>企业管理讲师</p>
            </div>
        </div>
    </main>

    <footer class="p-12 flex flex-col items-center border-t border-white/5">
        <div class="text-[10px] text-stone-600 tracking-widest uppercase mb-4">
            © 1981 NGUYEN TAN PHONG | 阮晋峰
        </div>
        <div class="text-[8px] text-stone-700">越南 • 胡志明市</div>
    </footer>

</body>
</html>
